<header class="site-header" style="display:flex;align-items:center;justify-content:space-between;padding:0.75rem 1rem;border-bottom:1px solid rgba(0,0,0,0.06);">

  <div style="display:flex;align-items:center;gap:0.6rem">
    <img src="/images/Darth_Linux.jpg" alt="K. Papadimitriou" width="36" height="36" style="border-radius:6px;object-fit:cover;">
    <span style="font-weight:700;color:var(--fg);line-height:1">{{ .Site.Params.author }}</span>
  </div>

  <!-- right: navigation -->
  <nav style="display:flex;gap:1rem;align-items:center">
    <a href="/" style="text-decoration:none;color:inherit">Home</a>
    <a href="/about/" style="text-decoration:none;color:inherit">About</a>
    <a href="/programming/" style="text-decoration:none;color:inherit">Programming</a>
    <a href="/publications/" style="text-decoration:none;color:inherit">Publications</a>

</header>
